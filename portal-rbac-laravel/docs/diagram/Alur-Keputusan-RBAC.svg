<text x="1085.0" y="173" text-anchor="middle" font-family="Carlito, Calibri, 'Liberation Sans', Arial, sans-serif" font-size="15" font-weight="400" fill="#374151"><tspan x="1085.0" dy="0">objek milik atau</tspan><tspan x="1085.0" dy="19.5">diampu pengguna?</tspan></text>
<line x1="1190" y1="172" x2="1215" y2="172" stroke="#11645B" stroke-width="2.4" marker-end="url(#g)"/>
<rect x="1215" y="120" width="210" height="105" rx="10" fill="#eef4ff" stroke="#2f5bd8" stroke-width="2"/>
<text x="1320.0" y="148" text-anchor="middle" font-family="Carlito, Calibri, 'Liberation Sans', Arial, sans-serif" font-size="18" font-weight="700" fill="#14275f"><tspan x="1320.0" dy="0">6. Service</tspan></text>
<text x="1320.0" y="173" text-anchor="middle" font-family="Carlito, Calibri, 'Liberation Sans', Arial, sans-serif" font-size="15" font-weight="400" fill="#374151"><tspan x="1320.0" dy="0">syarat bisnis OK?</tspan><tspan x="1320.0" dy="19.5">periode KRS, status,</tspan><tspan x="1320.0" dy="19.5">nilai</tspan></text>
<line x1="1425" y1="172" x2="1450" y2="172" stroke="#11645B" stroke-width="2.4" marker-end="url(#g)"/>
<rect x="1450" y="120" width="210" height="105" rx="10" fill="#eefaf7" stroke="#11645B" stroke-width="2"/>
<text x="1555.0" y="148" text-anchor="middle" font-family="Carlito, Calibri, 'Liberation Sans', Arial, sans-serif" font-size="18" font-weight="700" fill="#11645B"><tspan x="1555.0" dy="0">7. Transaksi DB</tspan></text>
<text x="1555.0" y="173" text-anchor="middle" font-family="Carlito, Calibri, 'Liberation Sans', Arial, sans-serif" font-size="15" font-weight="400" fill="#374151"><tspan x="1555.0" dy="0">simpan atomik,</tspan><tspan x="1555.0" dy="19.5">respons 302 + pesan</tspan><tspan x="1555.0" dy="19.5">sukses</tspan></text>
