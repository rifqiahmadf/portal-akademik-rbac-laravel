<text x="408" y="285" text-anchor="middle" font-family="Carlito, Calibri, 'Liberation Sans', Arial, sans-serif" font-size="14" font-weight="600" fill="#A74442"><tspan x="408" dy="0">tidak</tspan></text>
<rect x="275" y="330" width="210" height="120" rx="10" fill="#fdf2f2" stroke="#A74442" stroke-width="2"/>
<text x="380.0" y="358" text-anchor="middle" font-family="Carlito, Calibri, 'Liberation Sans', Arial, sans-serif" font-size="17" font-weight="700" fill="#A74442"><tspan x="380.0" dy="0">302 → /masuk</tspan></text>
<text x="380.0" y="382" text-anchor="middle" font-family="Carlito, Calibri, 'Liberation Sans', Arial, sans-serif" font-size="14" font-weight="400" fill="#374151"><tspan x="380.0" dy="0">Tanpa sesi atau akun</tspan><tspan x="380.0" dy="18.2">nonaktif</tspan></text>
<line x1="615" y1="225" x2="615" y2="330" stroke="#A74442" stroke-width="2.4" marker-end="url(#r)"/>
<text x="643" y="285" text-anchor="middle" font-family="Carlito, Calibri, 'Liberation Sans', Arial, sans-serif" font-size="14" font-weight="600" fill="#A74442"><tspan x="643" dy="0">tidak</tspan></text>
<rect x="510" y="330" width="210" height="120" rx="10" fill="#fdf2f2" stroke="#A74442" stroke-width="2"/>
<text x="615.0" y="358" text-anchor="middle" font-family="Carlito, Calibri, 'Liberation Sans', Arial, sans-serif" font-size="17" font-weight="700" fill="#A74442"><tspan x="615.0" dy="0">403 Forbidden</tspan></text>
<text x="615.0" y="382" text-anchor="middle" font-family="Carlito, Calibri, 'Liberation Sans', Arial, sans-serif" font-size="14" font-weight="400" fill="#374151"><tspan x="615.0" dy="0">Peran tidak memiliki izin</tspan><tspan x="615.0" dy="18.2">pada matriks</tspan></text>
<line x1="850" y1="225" x2="850" y2="330" stroke="#A74442" stroke-width="2.4" marker-end="url(#r)"/>
<text x="878" y="285" text-anchor="middle" font-family="Carlito, Calibri, 'Liberation Sans', Arial, sans-serif" font-size="14" font-weight="600" fill="#A74442"><tspan x="878" dy="0">tidak</tspan></text>
<rect x="745" y="330" width="210" height="120" rx="10" fill="#fdf2f2" stroke="#A74442" stroke-width="2"/>
<text x="850.0" y="358" text-anchor="middle" font-family="Carlito, Calibri, 'Liberation Sans', Arial, sans-serif" font-size="17" font-weight="700" fill="#A74442"><tspan x="850.0" dy="0">422 / kembali ke form</tspan></text>
<text x="850.0" y="382" text-anchor="middle" font-family="Carlito, Calibri, 'Liberation Sans', Arial, sans-serif" font-size="14" font-weight="400" fill="#374151"><tspan x="850.0" dy="0">Input tidak valid;</tspan><tspan x="850.0" dy="18.2">pesan galat per kolom</tspan></text>
<line x1="1085" y1="225" x2="1085" y2="330" stroke="#A74442" stroke-width="2.4" marker-end="url(#r)"/>
<text x="1113" y="285" text-anchor="middle" font-family="Carlito, Calibri, 'Liberation Sans', Arial, sans-serif" font-size="14" font-weight="600" fill="#A74442"><tspan x="1113" dy="0">tidak</tspan></text>
<rect x="980" y="330" width="210" height="120" rx="10" fill="#fdf2f2" stroke="#A74442" stroke-width="2"/>
<text x="1085.0" y="358" text-anchor="middle" font-family="Carlito, Calibri, 'Liberation Sans', Arial, sans-serif" font-size="17" font-weight="700" fill="#A74442"><tspan x="1085.0" dy="0">403 Forbidden</tspan></text>
<text x="1085.0" y="382" text-anchor="middle" font-family="Carlito, Calibri, 'Liberation Sans', Arial, sans-serif" font-size="14" font-weight="400" fill="#374151"><tspan x="1085.0" dy="0">Objek di luar cakupan,</tspan><tspan x="1085.0" dy="18.2">mis. kelas dosen lain</tspan></text>
<line x1="1320" y1="225" x2="1320" y2="330" stroke="#A74442" stroke-width="2.4" marker-end="url(#r)"/>
<text x="1348" y="285" text-anchor="middle" font-family="Carlito, Calibri, 'Liberation Sans', Arial, sans-serif" font-size="14" font-weight="600" fill="#A74442"><tspan x="1348" dy="0">tidak</tspan></text>
<rect x="1215" y="330" width="210" height="120" rx="10" fill="#fdf2f2" stroke="#A74442" stroke-width="2"/>
<text x="1320.0" y="358" text-anchor="middle" font-family="Carlito, Calibri, 'Liberation Sans', Arial, sans-serif" font-size="17" font-weight="700" fill="#A74442"><tspan x="1320.0" dy="0">Pesan galat bisnis</tspan></text>
<text x="1320.0" y="382" text-anchor="middle" font-family="Carlito, Calibri, 'Liberation Sans', Arial, sans-serif" font-size="14" font-weight="400" fill="#374151"><tspan x="1320.0" dy="0">KRS tutup, registrasi</tspan><tspan x="1320.0" dy="18.2">tidak aktif, nilai ada</tspan></text>
<rect x="40" y="330" width="210" height="120" rx="10" fill="#ffffff" stroke="#5b6577" stroke-width="2"/>
<text x="145.0" y="358" text-anchor="middle" font-family="Carlito, Calibri, 'Liberation Sans', Arial, sans-serif" font-size="18" font-weight="700" fill="#5b6577"><tspan x="145.0" dy="0">Catatan</tspan></text>
<text x="145.0" y="383" text-anchor="middle" font-family="Carlito, Calibri, 'Liberation Sans', Arial, sans-serif" font-size="15" font-weight="400" fill="#374151"><tspan x="145.0" dy="0">Setiap penolakan</tspan><tspan x="145.0" dy="19.5">terjadi sebelum</tspan><tspan x="145.0" dy="19.5">data berubah.</tspan></text>
<rect x="1450" y="330" width="210" height="120" rx="10" fill="#ffffff" stroke="#11645B" stroke-width="2"/>
<text x="1555.0" y="358" text-anchor="middle" font-family="Carlito, Calibri, 'Liberation Sans', Arial, sans-serif" font-size="17" font-weight="700" fill="#11645B"><tspan x="1555.0" dy="0">Hasil sah</tspan></text>
<text x="1555.0" y="382" text-anchor="middle" font-family="Carlito, Calibri, 'Liberation Sans', Arial, sans-serif" font-size="14" font-weight="400" fill="#374151"><tspan x="1555.0" dy="0">Perubahan tersimpan;</tspan><tspan x="1555.0" dy="18.2">pengguna kembali ke</tspan><tspan x="1555.0" dy="18.2">halaman sebelumnya.</tspan></text>
<rect x="40" y="500" width="1620" height="200" rx="10" fill="#f8fafc" stroke="#5b6577" stroke-width="2"/>
<text x="850.0" y="528" text-anchor="middle" font-family="Carlito, Calibri, 'Liberation Sans', Arial, sans-serif" font-size="19" font-weight="700" fill="#14275f"><tspan x="850.0" dy="0">Pemeriksaan berlapis (defense in depth)</tspan></text>
<text x="850.0" y="554" text-anchor="middle" font-family="Carlito, Calibri, 'Liberation Sans', Arial, sans-serif" font-size="16" font-weight="400" fill="#374151"><tspan x="850.0" dy="0">Lapis 1 (peran): matriks Rbac menentukan JENIS tindakan yang boleh dilakukan peran.</tspan><tspan x="850.0" dy="20.8">Lapis 2 (input): FormRequest memvalidasi tipe, rentang, dan keunikan data.</tspan><tspan x="850.0" dy="20.8">Lapis 3 (objek): Policy dan query terbatas memastikan DATA mana yang boleh disentuh.</tspan><tspan x="850.0" dy="20.8">Lapis 4 (bisnis): Service memeriksa periode KRS, status registrasi, dan keberadaan nilai di dalam transaksi.</tspan><tspan x="850.0" dy="20.8">Lapis 5 (data): batasan CHECK, FOREIGN KEY, dan UNIQUE di PostgreSQL menjadi jaring pengaman terakhir.</tspan></text>
</svg>
