<rect width="100%" height="100%" fill="#ffffff"/>
<text x="40" y="52" text-anchor="start" font-family="Carlito, Calibri, 'Liberation Sans', Arial, sans-serif" font-size="30" font-weight="700" fill="#14275f"><tspan x="40" dy="0">Alur keputusan akses RBAC pada Laravel</tspan></text>
<rect x="40" y="120" width="210" height="105" rx="10" fill="#ffffff" stroke="#5b6577" stroke-width="2"/>
<text x="145.0" y="148" text-anchor="middle" font-family="Carlito, Calibri, 'Liberation Sans', Arial, sans-serif" font-size="18" font-weight="700" fill="#14275f"><tspan x="145.0" dy="0">1. Permintaan HTTP</tspan></text>
<text x="145.0" y="173" text-anchor="middle" font-family="Carlito, Calibri, 'Liberation Sans', Arial, sans-serif" font-size="15" font-weight="400" fill="#374151"><tspan x="145.0" dy="0">metode + URL</tspan><tspan x="145.0" dy="19.5">+ cookie sesi</tspan></text>
<line x1="250" y1="172" x2="275" y2="172" stroke="#11645B" stroke-width="2.4" marker-end="url(#g)"/>
<rect x="275" y="120" width="210" height="105" rx="10" fill="#eef4ff" stroke="#2f5bd8" stroke-width="2"/>
<text x="380.0" y="148" text-anchor="middle" font-family="Carlito, Calibri, 'Liberation Sans', Arial, sans-serif" font-size="18" font-weight="700" fill="#14275f"><tspan x="380.0" dy="0">2. Authenticate</tspan></text>
<text x="380.0" y="173" text-anchor="middle" font-family="Carlito, Calibri, 'Liberation Sans', Arial, sans-serif" font-size="15" font-weight="400" fill="#374151"><tspan x="380.0" dy="0">sesi valid dan</tspan><tspan x="380.0" dy="19.5">akun aktif?</tspan></text>
<line x1="485" y1="172" x2="510" y2="172" stroke="#11645B" stroke-width="2.4" marker-end="url(#g)"/>
<rect x="510" y="120" width="210" height="105" rx="10" fill="#eef4ff" stroke="#2f5bd8" stroke-width="2"/>
<text x="615.0" y="148" text-anchor="middle" font-family="Carlito, Calibri, 'Liberation Sans', Arial, sans-serif" font-size="18" font-weight="700" fill="#14275f"><tspan x="615.0" dy="0">3. EnsureRbac</tspan></text>
<text x="615.0" y="173" text-anchor="middle" font-family="Carlito, Calibri, 'Liberation Sans', Arial, sans-serif" font-size="15" font-weight="400" fill="#374151"><tspan x="615.0" dy="0">Gate 'rbac': peran</tspan><tspan x="615.0" dy="19.5">punya izin pada</tspan><tspan x="615.0" dy="19.5">matriks?</tspan></text>
