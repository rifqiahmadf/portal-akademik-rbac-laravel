<rect x="745" y="120" width="210" height="105" rx="10" fill="#eef4ff" stroke="#2f5bd8" stroke-width="2"/>
<text x="850.0" y="148" text-anchor="middle" font-family="Carlito, Calibri, 'Liberation Sans', Arial, sans-serif" font-size="18" font-weight="700" fill="#14275f"><tspan x="850.0" dy="0">4. FormRequest</tspan></text>
<text x="850.0" y="173" text-anchor="middle" font-family="Carlito, Calibri, 'Liberation Sans', Arial, sans-serif" font-size="15" font-weight="400" fill="#374151"><tspan x="850.0" dy="0">input sesuai</tspan><tspan x="850.0" dy="19.5">aturan validasi?</tspan></text>
