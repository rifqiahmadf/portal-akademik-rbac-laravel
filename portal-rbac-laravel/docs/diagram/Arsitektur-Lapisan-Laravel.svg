<text x="700" y="330" text-anchor="middle" font-family="Carlito, Calibri, 'Liberation Sans', Arial, sans-serif" font-size="14" font-weight="600" fill="#5b6577"><tspan x="700" dy="0">view</tspan></text>
<text x="40" y="610" text-anchor="start" font-family="Carlito, Calibri, 'Liberation Sans', Arial, sans-serif" font-size="16" font-weight="400" fill="#5b6577"><tspan x="40" dy="0">Alur sebuah permintaan: Rute → Middleware → Controller → (FormRequest, Policy) → Service → Model → Basis data → tampilan atau pengalihan.</tspan></text>
<text x="40" y="640" text-anchor="start" font-family="Carlito, Calibri, 'Liberation Sans', Arial, sans-serif" font-size="16" font-weight="400" fill="#5b6577"><tspan x="40" dy="0">Penolakan terjadi sedini mungkin: 302 ke /masuk (tanpa sesi), 403 (izin/objek), 422 (input tidak valid), pesan galat bisnis (aturan akademik).</tspan></text>
