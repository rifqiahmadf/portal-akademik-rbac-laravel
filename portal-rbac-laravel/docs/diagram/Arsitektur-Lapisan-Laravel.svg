<text x="820.0" y="433" text-anchor="middle" font-family="Carlito, Calibri, 'Liberation Sans', Arial, sans-serif" font-size="15" font-weight="400" fill="#374151"><tspan x="820.0" dy="0">tampilan server-side, tanpa JavaScript klien</tspan><tspan x="820.0" dy="19.5">menu dibentuk dari Rbac::resourcesFor(peran)</tspan><tspan x="820.0" dy="19.5">token CSRF pada setiap form</tspan></text>
