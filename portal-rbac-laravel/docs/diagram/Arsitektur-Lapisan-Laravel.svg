<text x="280.0" y="433" text-anchor="middle" font-family="Carlito, Calibri, 'Liberation Sans', Arial, sans-serif" font-size="15" font-weight="400" fill="#374151"><tspan x="280.0" dy="0">Matriks 4 peran × 6 aktivitas × 4 tindakan</tspan><tspan x="280.0" dy="19.5">dipakai oleh Gate, menu navigasi, dan halaman matriks</tspan><tspan x="280.0" dy="19.5">tabel acuan diuji di RbacPolicyTest</tspan></text>
